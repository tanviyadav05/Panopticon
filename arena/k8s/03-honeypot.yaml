# A decoy that looks like target-app but isn't. honeypot_redirect.py
# (blue-team) can steer suspicious traffic here; anything that shows up in
# its logs is, by construction, traffic that was never supposed to be here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: honeypot
  namespace: panopticon-arena
  labels: { app: honeypot, panopticon.io/role: decoy }
spec:
  replicas: 1
  selector:
    matchLabels: { app: honeypot }
  template:
    metadata:
      labels: { app: honeypot, panopticon.io/role: decoy }
    spec:
      containers:
        - name: honeypot
          image: panopticon/target-app:latest   # same image, no DB wired up
          ports: [{ containerPort: 8080 }]
          env:
            - name: PORT
              value: "8080"
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits: { cpu: "100m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: honeypot
  namespace: panopticon-arena
spec:
  selector: { app: honeypot }
  ports: [{ port: 80, targetPort: 8080 }]
