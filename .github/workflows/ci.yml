name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-target-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arena/target-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -v

  python-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [observer, referee, red-team, blue-team, llm-core, monitoring, analysis, arena, common]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shared + component dependencies
        run: |
          pip install --break-system-packages -q numpy gymnasium pettingzoo fastapi "uvicorn[standard]" \
            scikit-learn psutil pyyaml requests matplotlib pandas websockets joblib torch kubernetes httpx \
            langgraph chromadb SQLAlchemy sentence-transformers playwright docker langsmith prometheus-client
      - name: Byte-compile (syntax/import smoke check)
        run: python3 -m compileall -q ${{ matrix.component }}

  integration-tests:
    runs-on: ubuntu-latest
    needs: [python-services]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --break-system-packages -q -r requirements.txt
      - name: Run integration tests
        run: python3 -m pytest tests/integration/ -v

  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate every YAML file parses
        run: |
          pip install --break-system-packages -q pyyaml
          python3 - << 'PY'
          import pathlib, yaml, sys
          failed = False
          for p in pathlib.Path(".").rglob("*.yaml"):
              try:
                  list(yaml.safe_load_all(p.read_text()))
              except Exception as e:
                  print(f"FAILED: {p}: {e}")
                  failed = True
          for p in pathlib.Path(".").rglob("*.yml"):
              try:
                  list(yaml.safe_load_all(p.read_text()))
              except Exception as e:
                  print(f"FAILED: {p}: {e}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

  json-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate every JSON file parses (Grafana dashboards, etc.)
        run: |
          python3 - << 'PY'
          import pathlib, json, sys
          failed = False
          for p in pathlib.Path(".").rglob("*.json"):
              try:
                  json.loads(p.read_text())
              except Exception as e:
                  print(f"FAILED: {p}: {e}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in $(find . -name "*.sh"); do
            bash -n "$f" && echo "OK: $f"
          done
