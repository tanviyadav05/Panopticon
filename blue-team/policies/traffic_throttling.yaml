# A static fallback throttle, for ingress controllers that read annotations
# from a NetworkPolicy-adjacent resource rather than the Service itself
# (rate_limiter.py's apply_to_arena() patches the Service directly; this is
# the declarative version for GitOps-style deployments that prefer
# everything to be a checked-in manifest).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traffic-throttling-marker
  namespace: panopticon-arena
  annotations:
    panopticon.io/note: >-
      This NetworkPolicy intentionally allows all traffic that was already
      allowed by 04-network-policies.yaml; it exists as an annotation
      carrier for ingress-controller-specific rate-limit settings, not as a
      access-control boundary itself.
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  podSelector:
    matchLabels:
      app: target-app
  policyTypes: ["Ingress"]
  ingress:
    - from: [{ namespaceSelector: {} }]
      ports: [{ protocol: TCP, port: 8080 }]
