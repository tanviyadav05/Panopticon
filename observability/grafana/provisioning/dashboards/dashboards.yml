# Auto-loads every .json file in ../dashboards/ as a dashboard on startup —
# no manual import needed. Dashboards are still editable in the UI
# afterward; this just seeds them.
apiVersion: 1

providers:
  - name: "panopticon"
    orgId: 1
    folder: "Project Panopticon"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
