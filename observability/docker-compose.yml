# observability/docker-compose.yml
#
# Run on the Command laptop (05):
#   cd observability && docker compose up -d
#
# Brings up Prometheus (scraping every laptop's node_exporter + every
# Panopticon service's /metrics, per prometheus/prometheus.yml) and
# Grafana (pre-provisioned with the Prometheus datasource + the
# dashboards in grafana/dashboards/, per grafana/provisioning/).
#
# Does NOT include node_exporter — that runs natively on each of the 5
# laptops (a single static binary, not worth containerizing — see
# node_exporter/install_node_exporter.sh), since a container on the
# Command laptop can only ever see the Command laptop's own metrics, not
# the other four laptops'.

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: panopticon-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    extra_hosts:
      - "llm-laptop:192.168.50.11"
      - "red-laptop:192.168.50.12"
      - "blue-laptop:192.168.50.13"
      - "arena-laptop:192.168.50.14"
      - "command-laptop:192.168.50.15"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"   # lets `curl -X POST localhost:9090/-/reload` pick up config edits without a restart

  grafana:
    image: grafana/grafana:latest
    container_name: panopticon-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # ${VAR:-default} — Docker Compose interpolates this from either a
      # shell-exported GF_SECURITY_ADMIN_PASSWORD, or an observability/.env
      # file (Compose auto-loads .env from the SAME DIRECTORY as this
      # compose file — that's a different file from the repo-root
      # .env.example, which nothing auto-loads; see that file's own header
      # comment). Falls back to "panopticon" if neither is set.
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-panopticon}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
